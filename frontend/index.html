<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090b" />
    <meta
      name="description"
      content="A self-hosted personal book tracker. It records what you thought of a book."
    />
    <!-- The PNGs come before the SVG deliberately. Browsers that support SVG
         favicons prefer them whatever the order; the ones that do not take the
         first PNG they can use, so the hand-hinted 16px raster wins where it
         is needed. Scaling the 24 grid down to 16 gives a soft arch and a
         smudged dot (docs/brand/BRAND.md). -->
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Akasha</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
