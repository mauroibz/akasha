<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0c0a" />
    <!-- The theme is set before the first paint so a Paper reader never sees a
         flash of Ink (Sprint 090). The same key and rules as src/lib/theme.ts. -->
    <script>
      (function () {
        var choice = "system";
        try {
          choice = localStorage.getItem("akasha:theme") || "system";
        } catch (error) {}
        var theme =
          choice === "paper" || choice === "ink"
            ? choice
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "paper"
              : "ink";
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="description"
      content="A self-hosted personal library of the books, music, anime, films and series you have, and what you thought of them."
    />
    <!-- The PNGs come before the SVG deliberately. Browsers that support SVG
         favicons prefer them whatever the order; the ones that do not take the
         first PNG they can use, so the hand-hinted 16px raster wins where it
         is needed. Scaling the 24 grid down to 16 gives a soft arch and a
         smudged dot (docs/brand/BRAND.md). -->
    <link rel="icon" href="/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Akasha</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
