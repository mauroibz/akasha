name: CI
on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned to the exact tag: setup-uv publishes a floating major only for
      # older lines (v6, v6.8), and no `v10` alias exists yet.
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          # The Makefile pins UV_CACHE_DIR on every uv invocation, so the
          # action's own default directory is never written to and its
          # cache-save step fails the job on a path that does not exist. Point
          # it at the directory the build actually uses.
          cache-local-path: /tmp/akasha-uv-cache
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: make bootstrap
      - run: make check
      - run: make test
      - run: make build
  # The Playwright suite carries the only automated guardrail on the grid and
  # virtualization contracts (technical spec section 8). It is not part of
  # `make test`, so it runs as its own job. See DEC-025.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      # Both projects: chromium against the dev server, production-bundle
      # against a real build, which is the only thing that can catch a
      # mis-split bundle (DEC-041).
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: /tmp/akasha-playwright-results
          retention-days: 7
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make smoke-container
