name: Release

# Publishes the image CI already smoke-tests. Runs only on a version tag —
# never on a branch push or a pull request — so a package version is minted
# exactly once per release, deliberately.
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The workflow's own token, scoped to this run: no personal access
      # token or repository secret exists for this job (Sprint 058).
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.full }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - uses: docker/setup-buildx-action@v3
      # The same Dockerfile the `container` job in ci.yml already smoke-tests —
      # there is no second image definition.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
