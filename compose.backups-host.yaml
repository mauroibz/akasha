# Opt-in tier 3: /backups on a real host directory while /data stays the named
# volume compose.yaml gives it (DEC-075). This is the shape DEC-040 asks for:
# a backup kept on the same disk as the database does not survive losing that
# disk, and on the default named volumes both land under the same Docker data
# root — so until this file, the shipped configuration could not satisfy its
# own decision without giving up the named-volume default.
#
# Point it at a second disk, a NAS share, anywhere that is not the database's
# disk:
#
#   mkdir -p /mnt/second-disk/akasha-backups
#   sudo chown 10001:10001 /mnt/second-disk/akasha-backups
#   docker compose -f compose.yaml -f compose.backups-host.yaml up -d
#
# The chown is the one privileged command this deployment needs. The container
# runs as uid 10001 and cannot write into a directory it does not own; expect
# "chown 10001:10001 ..." to print nothing and exit 0. Compose would create a
# missing directory as root:root, which would fail at 3am with "attempt to
# write a readonly database" — create and chown it yourself first.
#
# Deliberately not named docker-compose.override.yml, so it is never merged in
# by accident — invoke it explicitly, and use the same two -f flags on every
# subsequent docker compose command for this stack (down, logs, backups).
#
# Compose merges volume lists by target path, so the one entry below replaces
# only /backups; /data stays the named volume and the read-only Calibre mount
# is untouched.

services:
  akasha:
    volumes:
      - "${BACKUP_DIR:-./backups}:/backups"
