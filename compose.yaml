# Akasha — LAN-ONLY.
#
# v1 has NO AUTHENTICATION. Anyone who can reach this port can read and change
# every rating, note and shelf in the library. Publish it to a trusted home
# network only: never to the internet, never through a port forward, and never
# behind a reverse proxy that terminates on a public address.
#
# A host that has joined a VPN or mesh network (WireGuard, Tailscale, ZeroTier
# and the like) carries an extra interface, and AKASHA_BIND=0.0.0.0 publishes
# on that one too — an unauthenticated port reachable from outside the
# building without anyone having forwarded anything. To exclude it, bind
# AKASHA_BIND to one address rather than to everything.
#
# Copy .env.example to .env and set USER_AGENT_CONTACT before the first start.

services:
  akasha:
    build: .
    image: akasha:${AKASHA_VERSION:-local}
    logging:
      # The container's stdout is the only sink this service has: uvicorn's
      # access log is on, and one library page is many requests. Docker's
      # json-file default has no size bound, so without this block a home
      # server discovers the logs by running out of the disk it shares with
      # everything else it is for. 10 MiB x 5 is about two days of a chatty
      # incident and a 50 MiB ceiling; both knobs are overridable in the same
      # shape as the rest of this file.
      driver: json-file
      options:
        max-size: "${AKASHA_LOG_MAX_SIZE:-10m}"
        max-file: "${AKASHA_LOG_MAX_FILE:-5}"
    ports:
      # Bound to the LAN interface you choose. Leave AKASHA_BIND at 0.0.0.0 only
      # on a network you trust; 127.0.0.1 restricts it to this machine. Note
      # that 0.0.0.0 publishes on an overlay-network interface too — see the
      # header above.
      - "${AKASHA_BIND:-0.0.0.0}:${AKASHA_PORT:-4441}:8000"
    environment:
      # An explicit pass-through list: the compose file is the list of what
      # the container is allowed to receive, deliberately not `env_file:`.
      # env_file would hand it the whole .env, including the example's
      # BOOK_TRACKER_ENVIRONMENT=development, which turns off the production
      # guard that makes USER_AGENT_CONTACT mandatory.
      #
      # The bare list form resolves from .env when set and is omitted from the
      # container's environment when not. Map form with a default
      # (`${VAR:-26214400}`) would fork the real default into a second place;
      # map form with an empty default (`${VAR:-}`) would pass an empty string
      # into a setting pydantic parses as an integer and refuse to start. The
      # bare form keeps config.py the single source of every default.
      #
      # USER_AGENT_CONTACT is the one variable with no fallback: it is
      # mandatory in production, and `:?` makes a missing value refuse to
      # start rather than run silently anonymous.
      - USER_AGENT_CONTACT=${USER_AGENT_CONTACT:?Set USER_AGENT_CONTACT in .env}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - BOOK_TRACKER_BACKUP_DIR=/backups
      - BOOK_TRACKER_ATTACHMENT_MAX_BYTES
      - BOOK_TRACKER_SQLITE_BUSY_TIMEOUT_MS
      - TMDB_READ_TOKEN
    volumes:
      - data:/data
      # Named volumes by default (DEC-075): Docker seeds a fresh volume from the
      # image's own /data, /backups — already chown'd to the non-root user — so
      # there is nothing to chown from the outside. Backups still live on their
      # own mount, outside the data volume, on purpose (DEC-040): a backup kept
      # inside the thing it backs up is lost with it. Want BACKUP_DIR on a NAS
      # share, or either directory as a real host path? Use
      # `docker compose -f compose.yaml -f compose.bind-mounts.yaml up -d`.
      - backups:/backups
      # Calibre is opened read-only in the mount and again in code.
      - "${CALIBRE_DIR:-./calibre}:/calibre:ro"
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    labels:
      org.akasha.security-boundary: "LAN-only; v1 has no authentication and must never be internet-exposed"

volumes:
  data:
    name: ${AKASHA_DATA_VOLUME:-akasha_data}
  backups:
    name: ${AKASHA_BACKUP_VOLUME:-akasha_backups}
