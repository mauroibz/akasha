# Akasha — the exposure rule.
#
# Authentication is OFF by default: anyone who can reach this port can read and
# change every rating, note and shelf in the library. Publish it to a trusted
# home network only: never to the internet, never through a port forward, and
# never behind a reverse proxy that terminates on a public address.
#
# Exposing it beyond a trusted LAN requires all four of: AKASHA_AUTH=on, TLS
# terminating in front, the session cookie Secure (AKASHA_COOKIE_SECURE=true),
# and setup completed (or the admin bootstrapped from the environment) before
# the hostname is published (DEC-180). Authentication alone is not permission
# to publish. For the internet, use the compose.public.yaml overlay and the
# runbook's "Publishing on the internet" section, not a port forward.
#
# A host that has joined a VPN or mesh network (WireGuard, Tailscale, ZeroTier
# and the like) carries an extra interface, and AKASHA_BIND=0.0.0.0 publishes
# on that one too — a port reachable from outside the building without anyone
# having forwarded anything. To exclude it, bind AKASHA_BIND to one address
# rather than to everything.
#
# Containment (Sprint 128): the root filesystem is read-only, every Linux
# capability is dropped, privileges cannot be regained, and memory, CPU and
# process count are capped. The process can write only /data, /backups and a
# small /tmp; its own code is root's. A compromised process still holds the
# library, so this bounds the damage, it does not undo it.
#
# Copy .env.example to .env and set USER_AGENT_CONTACT before the first start.

services:
  akasha:
    # Pull-based by design (Sprint 058): this file carries no `build:` key.
    # A service naming both `image:` and `build:` builds silently instead of
    # pulling whenever the local image is missing, which defeats the point of
    # publishing one. Building from source is `compose.build.yaml`:
    #   docker compose -f compose.yaml -f compose.build.yaml up -d --build
    image: ghcr.io/mauroibz/akasha:${AKASHA_VERSION:-3.1.0}
    logging:
      # The container's stdout is the only sink this service has: uvicorn's
      # access log is on, and one library page is many requests. Docker's
      # json-file default has no size bound, so without this block a home
      # server discovers the logs by running out of the disk it shares with
      # everything else it is for. 10 MiB x 5 is about two days of a chatty
      # incident and a 50 MiB ceiling; both knobs are overridable in the same
      # shape as the rest of this file.
      driver: json-file
      options:
        max-size: "${AKASHA_LOG_MAX_SIZE:-10m}"
        max-file: "${AKASHA_LOG_MAX_FILE:-5}"
    ports:
      # Bound to the LAN interface you choose. Leave AKASHA_BIND at 0.0.0.0 only
      # on a network you trust; 127.0.0.1 restricts it to this machine. Note
      # that 0.0.0.0 publishes on an overlay-network interface too — see the
      # header above.
      - "${AKASHA_BIND:-0.0.0.0}:${AKASHA_PORT:-4441}:8000"
    environment:
      # An explicit pass-through list: the compose file is the list of what
      # the container is allowed to receive, deliberately not `env_file:`.
      # env_file would hand it the whole .env, including the example's
      # AKASHA_ENVIRONMENT=development, which turns off the production
      # guard that makes USER_AGENT_CONTACT mandatory.
      #
      # The bare list form resolves from .env when set and is omitted from the
      # container's environment when not. Map form with a default
      # (`${VAR:-26214400}`) would fork the real default into a second place;
      # map form with an empty default (`${VAR:-}`) would pass an empty string
      # into a setting pydantic parses as an integer and refuse to start. The
      # bare form keeps config.py the single source of every default.
      #
      # USER_AGENT_CONTACT is the one variable with no fallback: it is
      # mandatory in production, and `:?` makes a missing value refuse to
      # start rather than run silently anonymous.
      - USER_AGENT_CONTACT=${USER_AGENT_CONTACT:?Set USER_AGENT_CONTACT in .env}
      - TZ=${TZ:-UTC}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GOOGLE_BOOKS_API_KEY=${GOOGLE_BOOKS_API_KEY:-}
      - AKASHA_BACKUP_DIR=/backups
      - AKASHA_AUTH
      - AKASHA_COOKIE_SECURE
      - AKASHA_TRUSTED_PROXY_PEERS
      - AKASHA_TRUSTED_PROXY_HEADER
      - AKASHA_TRUSTED_HEADER_AUTOCREATE
      - AKASHA_LOGIN_MAX_FAILURES
      - AKASHA_LOGIN_WINDOW_SECONDS
      - AKASHA_CLIENT_IP_HEADER
      - AKASHA_SESSION_DAYS
      - AKASHA_SETUP_TOKEN
      - AKASHA_ADMIN_USERNAME
      - AKASHA_ADMIN_PASSWORD
      - AKASHA_ATTACHMENT_MAX_BYTES
      - AKASHA_MIN_FREE_BYTES
      - AKASHA_SQLITE_BUSY_TIMEOUT_MS
      - AKASHA_PROVIDER_DAILY_LIMITS
      - AKASHA_RECOMMEND_DAILY_LIMITS
      - AKASHA_METRICS
      - AKASHA_CF_ACCESS_TEAM_DOMAIN
      - AKASHA_CF_ACCESS_AUD
      - TMDB_READ_TOKEN
      - AKASHA_RECS_MODEL_PROVIDER
      - AKASHA_RECS_MODEL
      - AKASHA_RECS_MODEL_KEY
      - AKASHA_RECS_MODEL_URL
      - AKASHA_RECS_EMBEDDINGS_PROVIDER
      - AKASHA_RECS_EMBEDDINGS_MODEL
      - AKASHA_RECS_EMBEDDINGS_KEY
      - AKASHA_RECS_EMBEDDINGS_URL
      - ANTHROPIC_API_KEY
      - GEMINI_API_KEY
      - OPENAI_API_KEY
    volumes:
      - data:/data
      # Named volumes by default (DEC-075): Docker seeds a fresh volume from the
      # image's own /data, /backups — already chown'd to the non-root user — so
      # there is nothing to chown from the outside. Backups still live on their
      # own mount, outside the data volume, on purpose (DEC-040): a backup kept
      # inside the thing it backs up is lost with it. Want BACKUP_DIR on a NAS
      # share, or either directory as a real host path? Use
      # `docker compose -f compose.yaml -f compose.bind-mounts.yaml up -d`.
      - backups:/backups
      # Calibre is opened read-only in the mount and again in code.
      - "${CALIBRE_DIR:-./calibre}:/calibre:ro"
    # Containment (Sprint 128, F20). Nothing here changes what the application
    # does; it narrows what a compromised process could do to the host.
    #
    # The root filesystem is read-only: the process writes only to the volumes
    # above and to this /tmp. The image points TMPDIR at /data/tmp, so uploads
    # and imports spool to the data volume; /tmp is a small RAM-backed scratch
    # space for libraries that insist on it, and nothing there can be executed.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    # No Linux capabilities at all — the process runs as an unprivileged user
    # and binds port 8000, which needs none — and no way to gain any back
    # through a setuid binary.
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    # Ceilings, not reservations: a runaway import or a decompression bomb
    # stops at the cap instead of starving the rest of the server. Raise them
    # in .env if a very large import needs more; the defaults are well above
    # what a normal library uses. One CPU is all a single-worker Python
    # process uses anyway, and is accepted on any host.
    mem_limit: ${AKASHA_MEM_LIMIT:-1536m}
    cpus: ${AKASHA_CPUS:-1.0}
    pids_limit: ${AKASHA_PIDS_LIMIT:-256}
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    labels:
      org.akasha.security-boundary: "Auth off by default; no internet-reachable proxy, DNS or port forward unless AKASHA_AUTH=on, TLS terminates in front, the cookie is Secure, and setup is completed before publishing"

volumes:
  data:
    name: ${AKASHA_DATA_VOLUME:-akasha_data}
  backups:
    name: ${AKASHA_BACKUP_VOLUME:-akasha_backups}
