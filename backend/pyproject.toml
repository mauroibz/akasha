[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-tracker"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.7,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.28",
  "pillow>=11,<12",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.1,<26",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/book_tracker"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=book_tracker --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["book_tracker"]

[tool.coverage.run]
branch = true
