[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-tracker"
version = "1.7.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.7,<4.10",
  "fastapi>=0.115,<0.116",
  "httpx>=0.27,<0.28",
  "pillow>=11,<12",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "structlog>=25.1,<26",
  "uvicorn>=0.34,<1",
]

[project.scripts]
# Console script rather than `python -m`: the package __init__ imports main,
# which imports this module, so runpy would execute it a second time under
# __main__ and warn about it in every nightly cron log.
akasha-backup = "book_tracker.backup:main"
akasha-attachments = "book_tracker.reclaim:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.16.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/book_tracker"]

[tool.pytest.ini_options]
# Every test is bounded: a deadlock fails with the test's name instead of
# looking like slow work (TESTING.md's Sprint 035 triage lesson). 30 s is
# measured headroom, not a guess — the slowest current test is 11.7 s
# (test_generic_imports.py's declared-caps refusal); nothing else exceeds 1.5 s.
addopts = "--strict-markers --timeout=30"
# Coverage is deliberately NOT here: `addopts` is paid by every invocation,
# including the focused single-file runs the playbook's first rung asks for,
# which charged 26 s and a 60-line table to each one (Sprint 055, DEC-114's
# measurement). `make test` and `make coverage` pass the coverage flags
# explicitly, so the number exists where it is owed and nowhere else.
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["book_tracker"]

[tool.coverage.run]
branch = true
